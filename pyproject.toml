# 本文件由 scripts/gen-pyprojects.py 从 scripts/repo_config.py 生成，不要手改。
# 改元数据请改 repo_config.py 后重跑：python scripts/gen-pyprojects.py

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sql-review"
version = "0.2.0"
description = "SQL 体检 MCP：规则分册静态体检、自动修法、修复验证、执行计划对比、索引建议。Tier0 零依赖可用。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "罗文星", email = "1172566410@qq.com" }]
maintainers = [{ name = "罗文星", email = "1172566410@qq.com" }]
keywords = ["database", "sql", "dba", "database-tooling", "llm", "mcp", "sql-lint", "sql-review", "sql-rewrite", "code-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = [
    "sqltk-core[mcp]>=0.2.0",
    "sqltk-store>=0.2.0",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
mcp-sql-review = "sql_review.cli:main"

[project.urls]
Homepage = "https://github.com/Apollo-lwx/mcp-sql-review"
Repository = "https://github.com/Apollo-lwx/mcp-sql-review"
Issues = "https://github.com/Apollo-lwx/mcp-sql-review/issues"
Changelog = "https://github.com/Apollo-lwx/db-ai-toolchain/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed", "*.yaml", "*.yml", "*.json"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9"]
